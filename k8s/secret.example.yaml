# Copy to secret.yaml, fill in real values, and keep it out of git.
# Shared with the worker Deployment (worker branch), which reads RABBITMQ_URL and GEMINI_API_KEY.
apiVersion: v1
kind: Secret
metadata:
  name: invoiceai-secrets
type: Opaque
stringData:
  RABBITMQ_USER: invoiceai
  RABBITMQ_PASSWORD: change-me
  RABBITMQ_URL: amqp://invoiceai:change-me@rabbitmq:5672/%2F
  GEMINI_API_KEY: your-gemini-api-key
