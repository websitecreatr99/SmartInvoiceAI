; The API and worker reconnect on their own until RabbitMQ is up, so start order doesn't matter.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:rabbitmq]
; The /usr/sbin wrapper insists on root or the rabbitmq user; the real script runs as anyone.
command=/usr/lib/rabbitmq/bin/rabbitmq-server
priority=1
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn app:app --host 0.0.0.0 --port 5000
directory=/app/api
; Keyless jobs use the Space's GOOGLE_API_KEY; "1" answers them with sample data instead.
environment=DEMO_WITHOUT_KEY="0"
priority=10
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=python worker.py
directory=/app/worker
priority=10
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
