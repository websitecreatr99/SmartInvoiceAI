# Scale with: docker compose up -d --build --scale api=3 --scale worker=4
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: invoiceai-api:local
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: ${API_REPLICAS:-2}

  worker:
    image: invoiceai-api:local
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-1}"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      start_period: 30s
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  storage:
  redis-data:
