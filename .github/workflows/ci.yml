name: Worker CI/CD

on:
  push:
    branches: [worker]
  pull_request:
    branches: [worker]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-worker

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

  docker:
    name: Build, smoke test against RabbitMQ & publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/worker' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: invoiceai-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start worker container
        run: |
          docker run -d --name worker --network host \
            -e RABBITMQ_URL=amqp://guest:guest@localhost:5672/%2F \
            invoiceai-worker:ci

      - name: Smoke test (job in -> result out)
        run: |
          pip install pika==1.3.2
          RABBITMQ_URL=amqp://guest:guest@localhost:5672/%2F python scripts/smoke_test.py

      - name: Metrics endpoint reports the processed PDF
        run: |
          curl -fsS localhost:9100/metrics | tee metrics.txt | grep -E '^invoiceai_worker_pdfs_total\{status="error"\} 1\.0$'
          grep -q '^invoiceai_worker_stage_duration_seconds_count{stage="ocr"}' metrics.txt

      - name: Worker logs
        if: always()
        run: docker logs worker 2>&1 | tail -100

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Runs only once the infra branch's Terraform is applied and the repository variable
  # AWS_DEPLOY_ROLE_ARN is set (Terraform output github_deploy_role_arn); until then it is skipped.
  deploy-aws:
    name: Deploy to AWS ECS
    needs: docker
    if: github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      ECR_REPOSITORY: invoiceai-worker
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'invoiceai-prod-cluster' }}
      ECS_SERVICE: invoiceai-prod-worker
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # ECR tags are immutable: one tag per commit.
      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha

      # The task definition family has the service's name; Terraform created revision 1.
      - name: Current task definition
        run: aws ecs describe-task-definition --task-definition "$ECS_SERVICE" --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: worker
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
