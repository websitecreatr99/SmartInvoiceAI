# Load balancer in front of the API replicas.
# Docker's DNS returns every `api` container; resolving at request time (via the
# variable below) picks up replicas added or removed with `--scale` without a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    client_max_body_size 100m;

    location / {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Retry another replica if one is down or restarting.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
